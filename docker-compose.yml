# docker-compose for the MUD. Single profile:
#
#   docker compose up -d
#
# Build and push images with the build workflow on push to main:
# images are tagged :prod and pulled by this compose file by default.
#
# Postgres: this stack assumes an existing Postgres reachable on the
# `mud-net` docker network. The MUD containers connect via
# MUD_DATABASE_URL. The bundled Postgres compose at docker/postgresql/
# is kept for local dev but is no longer included in prod deploys.

name: mud

x-server-base: &server-base
  build:
    context: .
    dockerfile: docker/Dockerfile.server
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "ss -tln | grep -q :27015 || exit 1"]
    interval: 30s
    timeout: 5s
    retries: 5

x-gateway-base: &gateway-base
  build:
    context: .
    dockerfile: docker/Dockerfile.gateway
  restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:

networks:
  mud-net:
    name: mud-net

services:

  mud-server:
    <<: *server-base
    image: ${REGISTRY:-ghcr.io/cronix1000}/mud-server:${TAG:-prod}
    container_name: mud-server
    hostname: mud-server
    environment:
      MUD_DATABASE_URL: ${MUD_DATABASE_URL:?MUD_DATABASE_URL must be set in .env}
      PORT: 27015
      TZ: ${TZ:-UTC}
    networks:
      - mud-net
    expose:
      - "27015"

  mud-gateway:
    <<: *gateway-base
    image: ${REGISTRY:-ghcr.io/cronix1000}/mud-gateway:${TAG:-prod}
    container_name: mud-gateway
    hostname: mud-gateway
    environment:
      MUD_HOST: mud-server
      MUD_PORT: 27015
      WS_HOST: 0.0.0.0
      WS_PORT: 8443
      LOG_LEVEL: ${LOG_LEVEL:-info}
      IDLE_TIMEOUT_S: ${IDLE_TIMEOUT_S:-1800}
    networks:
      - mud-net
    ports:
      - "${GATEWAY_PORT:-8443}:8443"

  mud-admin:
    image: ${REGISTRY:-ghcr.io/cronix1000}/mud-admin:${TAG:-prod}
    container_name: mud-admin
    hostname: mud-admin
    restart: unless-stopped
    environment:
      MUD_DATABASE_URL: ${MUD_DATABASE_URL:?MUD_DATABASE_URL must be set in .env}
      HOST: 0.0.0.0
      PORT: 3000
    networks:
      - mud-net
    expose:
      - "3000"

  mud-client:
    image: ${REGISTRY:-ghcr.io/cronix1000}/mud-client:${TAG:-prod}
    container_name: mud-client
    hostname: mud-client
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3001
      MUD_DATABASE_URL: ${MUD_DATABASE_URL:?MUD_DATABASE_URL must be set in .env}
    networks:
      - mud-net
    expose:
      - "3001"

  caddy:
    image: caddy:2-alpine
    container_name: mud-caddy
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - mud-net
