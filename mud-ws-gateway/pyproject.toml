[project]
name = "mud-gateway"
version = "0.3.1"
description = "Raw WebSocket <-> TCP relay for the ModularMudServer MUD"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.10",
]

[project.scripts]
mud-gateway = "mud_gateway.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mud_gateway"]

[tool.uv]
package = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
