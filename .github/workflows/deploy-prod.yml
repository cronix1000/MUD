name: deploy-prod

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to deploy (default: latest)'
        required: false
        default: 'latest'
  push:
    branches: [main]
    paths:
      - 'ModularMudServer/**'
      - 'MudAdmin/**'
      - 'MudClient/**'
      - 'mud-ws-gateway/**'
      - 'docker/**'
      - 'docker-compose.yml'
      - 'scripts/**'
      - '.github/workflows/deploy-prod.yml'
      - '.github/workflows/build.yml'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  build:
    name: wait for build to finish
    uses: ./.github/workflows/build.yml
    with:
      ref: main
  deploy:
    name: deploy to prod
    runs-on: ubuntu-latest
    environment: production
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh_private_key: ${{ secrets.PROD_SSH_KEY }}

      - name: Verify SSH key fingerprint
        env:
          KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          # Don't print the key, only its fingerprint and length.
          printf '%s' "$KEY" | ssh-keygen -lf - 2>/dev/null || echo "ssh-keygen could not parse the secret"
          echo "key byte length: $(printf '%s' "$KEY" | wc -c)"
          echo "key has BEGIN marker: $(printf '%s' "$KEY" | grep -q 'BEGIN OPENSSH PRIVATE KEY' && echo yes || echo no)"
          echo "key has END marker: $(printf '%s' "$KEY" | grep -q 'END OPENSSH PRIVATE KEY' && echo yes || echo no)"
          echo "key line count: $(printf '%s' "$KEY" | wc -l)"

      - name: Deploy
        run: |
          ssh -o StrictHostKeyChecking=no \
              ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }} \
              "bash -s -- prod ${{ inputs.tag || 'prod' }}" \
              < scripts/deploy-remote.sh

      - name: Notify
        if: always()
        run: |
          echo "deploy status: ${{ job.status }}"
          echo "view: https://${{ secrets.PROD_DOMAIN }}"
