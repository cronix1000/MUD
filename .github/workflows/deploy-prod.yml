name: deploy-prod

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to deploy (default: latest)'
        required: false
        default: 'latest'
  push:
    branches: [main]
    paths:
      - 'ModularMudServer/**'
      - 'MudAdmin/**'
      - 'MudClient/**'
      - 'mud-ws-gateway/**'
      - 'docker/**'
      - 'docker-compose.yml'
      - 'scripts/**'
      - '.github/workflows/deploy-prod.yml'
      - '.github/workflows/build.yml'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  build:
    name: wait for build to finish
    uses: ./.github/workflows/build.yml
    with:
      ref: main
  deploy:
    name: deploy to prod
    runs-on: ubuntu-latest
    environment: production
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh_private_key: ${{ secrets.PROD_SSH_KEY }}

      - name: Deploy
        run: |
          ssh -o StrictHostKeyChecking=no \
              ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }} \
              "bash -s -- prod ${{ inputs.tag || 'prod' }}" \
              < scripts/deploy-remote.sh

      - name: Notify
        if: always()
        run: |
          echo "deploy status: ${{ job.status }}"
          echo "view: https://${{ secrets.PROD_DOMAIN }}"
