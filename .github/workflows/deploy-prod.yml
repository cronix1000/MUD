name: deploy-prod

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ModularMudServer/**'
      - 'MudAdmin/**'
      - 'MudClient/**'
      - 'mud-ws-gateway/**'
      - 'docker/**'
      - 'docker-compose.yml'
      - 'scripts/**'
      - '.github/workflows/deploy-prod.yml'
      - '.github/workflows/build.yml'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  build:
    name: wait for build to finish
    uses: ./.github/workflows/build.yml
    with:
      ref: main
  deploy:
    name: deploy to prod
    runs-on: ubuntu-latest
    environment: production
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.PROD_SSH_KEY }}" \
            | tr -d '\r' \
            | sed 's/[[:space:]]*$//' \
            > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if ! grep -q 'BEGIN OPENSSH PRIVATE KEY' ~/.ssh/deploy_key; then
            echo "secret is missing PEM headers, wrapping"
            {
              echo "-----BEGIN OPENSSH PRIVATE KEY-----"
              cat ~/.ssh/deploy_key
              echo "-----END OPENSSH PRIVATE KEY-----"
            } > ~/.ssh/deploy_key.tmp
            mv ~/.ssh/deploy_key.tmp ~/.ssh/deploy_key
          fi
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -lf ~/.ssh/deploy_key || { echo "key invalid"; exit 1; }

      - name: Deploy
        run: |
          ssh -o StrictHostKeyChecking=no \
              -i ~/.ssh/deploy_key \
              ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }} \
              "bash -s" \
              < scripts/deploy-remote.sh

      - name: Notify
        if: always()
        run: |
          echo "deploy status: ${{ job.status }}"
          echo "view: https://${{ secrets.PROD_DOMAIN }}"
