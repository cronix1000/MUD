name: deploy-prod

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to deploy (default: latest)'
        required: false
        default: 'latest'
  push:
    branches: [main]
    paths:
      - 'ModularMudServer/**'
      - 'MudAdmin/**'
      - 'MudClient/**'
      - 'mud-ws-gateway/**'
      - 'docker/**'
      - 'docker-compose.yml'
      - 'scripts/**'
      - '.github/workflows/deploy-prod.yml'
      - 'package.json'
      - 'package-lock.json'

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy to prod
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy over SSH
        if: ${{ secrets.PROD_HOST != '' && secrets.PROD_USER != '' && secrets.PROD_SSH_KEY != '' }}
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_PROFILE: prod
          DEPLOY_TAG: ${{ github.event.inputs.tag || 'latest' }}
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script_path: scripts/deploy-remote.sh
          envs: DEPLOY_PROFILE,DEPLOY_TAG

      - name: Skip deploy (missing secrets)
        if: ${{ !(secrets.PROD_HOST != '' && secrets.PROD_USER != '' && secrets.PROD_SSH_KEY != '') }}
        run: echo "::warning::Skipping prod deploy because PROD_HOST, PROD_USER, or PROD_SSH_KEY is not configured."

      - name: Notify
        if: always()
        run: |
          echo "deploy status: ${{ job.status }}"
          if [ -n "${{ secrets.PROD_DOMAIN }}" ]; then
            echo "view: https://${{ secrets.PROD_DOMAIN }}"
          fi
