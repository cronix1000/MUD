name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  docker:
    name: docker build (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: server
            dockerfile: docker/Dockerfile.server
            platforms: linux/amd64
          - image: gateway
            dockerfile: docker/Dockerfile.gateway
            platforms: linux/amd64
          - image: admin
            dockerfile: docker/Dockerfile.web
            build-args: APP=mudadmin
            platforms: linux/amd64
          - image: client
            dockerfile: docker/Dockerfile.web
            build-args: APP=mudclient,WS_URL=wss://CHANGE_ME/ws
            platforms: linux/amd64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pre-create GHCR package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ env.IMAGE_OWNER }}
          PACKAGE: mud-${{ matrix.image }}
        run: |
          set -e
          owner_type=$(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/users/$OWNER" | grep -o '"type": "[a-z]*"' | head -1 | cut -d'"' -f4)
          owner_type=${owner_type:-User}
          echo "owner $OWNER is $owner_type"
          base="https://api.github.com"
          if [ "$owner_type" = "Organization" ]; then
            check_url="$base/orgs/$OWNER/packages/container/$PACKAGE"
            create_url="$base/orgs/$OWNER/packages"
          else
            check_url="$base/users/$OWNER/packages/container/$PACKAGE"
            create_url="$base/users/$OWNER/packages"
          fi
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$check_url")
          if [ "$status" = "200" ]; then
            echo "package $PACKAGE already exists"
            exit 0
          fi
          echo "package $PACKAGE missing (HTTP $status); creating"
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$create_url" \
            -d "{\"name\":\"$PACKAGE\",\"visibility\":\"private\",\"package_type\":\"container\"}" \
            || echo "package create failed (may already exist); continuing"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/mud-${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=prod,enable={{is_default_branch}}
            type=raw,value=beta,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build-args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
