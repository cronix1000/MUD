name: deploy-beta

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to deploy (default: latest)'
        required: false
        default: 'latest'
  push:
    branches: [beta]
    paths:
      - 'ModularMudServer/**'
      - 'MudAdmin/**'
      - 'MudClient/**'
      - 'mud-ws-gateway/**'
      - 'docker/**'
      - 'docker-compose.yml'
      - 'scripts/**'
      - '.github/workflows/deploy-beta.yml'
      - '.github/workflows/build.yml'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-beta
  cancel-in-progress: false

jobs:
  build:
    name: wait for build to finish
    uses: ./.github/workflows/build.yml
    with:
      ref: beta
  deploy:
    name: deploy to beta
    runs-on: ubuntu-latest
    environment: beta
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # Normalise CRLF -> LF and trim trailing whitespace, in case the
          # secret was pasted with Windows line endings.
          printf '%s\n' "${{ secrets.PROD_SSH_KEY }}" \
            | tr -d '\r' \
            | sed 's/[[:space:]]*$//' \
            > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          wc -c ~/.ssh/deploy_key
          head -c 6 ~/.ssh/deploy_key | od -An -c | head -1
          tail -c 6 ~/.ssh/deploy_key | od -An -c | head -1
          grep -c 'BEGIN OPENSSH PRIVATE KEY' ~/.ssh/deploy_key && echo 'has BEGIN marker' || echo 'NO BEGIN MARKER'
          grep -c 'END OPENSSH PRIVATE KEY' ~/.ssh/deploy_key && echo 'has END marker' || echo 'NO END MARKER'
          ssh-keygen -lf ~/.ssh/deploy_key || { echo "key invalid"; exit 1; }

      - name: Deploy
        run: |
          ssh -o StrictHostKeyChecking=no \
              -i ~/.ssh/deploy_key \
              ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }} \
              "bash -s -- beta ${{ inputs.tag || 'beta' }}" \
              < scripts/deploy-remote.sh

      - name: Notify
        if: always()
        run: |
          echo "deploy status: ${{ job.status }}"
          echo "view: https://${{ secrets.BETA_DOMAIN }}"