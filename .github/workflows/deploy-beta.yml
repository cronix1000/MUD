name: deploy-beta
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to deploy (default: latest)'
        required: false
        default: 'latest'
concurrency:
  group: deploy-beta
  cancel-in-progress: false
jobs:
  deploy:
    name: deploy to beta
    runs-on: [self-hosted, homelab-beta]
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        run: bash scripts/deploy-remote.sh beta ${{ inputs.tag || 'latest' }}
      - name: Notify
        if: always()
        run: |
          echo "deploy status: ${{ job.status }}"
          echo "view: https://${{ secrets.BETA_DOMAIN }}"